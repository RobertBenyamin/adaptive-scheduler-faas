apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cnn-serving
  namespace: default
spec:
  template:
    spec:
      containerConcurrency: 20
      containers:
        - image: kind.local/server-cnn-serving:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: session-token
          resources:
            requests:
              cpu: 250m
              memory: 640M
            limits:
              cpu: 500m
    metadata:
      annotations:
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/max-scale: "20"
        autoscaling.knative.dev/minScale: "5"
